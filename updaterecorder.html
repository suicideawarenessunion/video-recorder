<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video & Photo Recorder</title>

<style>
  body { 
    font-family: sans-serif; 
    padding: 0; 
    margin: 0; 
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #f8f8f8;
    min-height: 100vh;
  }

  h2 { margin: 10px 0; }

  /* BIG preview */
  video {
    width: 100%;
    height: calc(100vh - 230px);
    object-fit: cover;
    background: black;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin: 10px 0;
    flex-wrap: wrap;
    justify-content: center;
  }

  button { 
    padding: 12px 18px; 
    font-size: 16px; 
    cursor: pointer;
  }

  #toast {
    visibility: hidden;
    min-width: 250px;
    background-color: #333;
    color: #fff;
    text-align: center;
    border-radius: 4px;
    padding: 16px;
    position: fixed;
    z-index: 10;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    font-size: 17px;
  }

  #toast.show {
    visibility: visible;
    animation: fadein 0.5s, fadeout 0.5s 2.5s;
  }

  @keyframes fadein {
    from { bottom: 0; opacity: 0; }
    to { bottom: 30px; opacity: 1; }
  }

  @keyframes fadeout {
    from { bottom: 30px; opacity: 1; }
    to { bottom: 0; opacity: 0; }
  }
</style>
</head>

<body>

<h2>Video & Photo Recorder</h2>

<video id="preview" autoplay muted playsinline></video>

<div class="controls">
  <button id="flipBtn">🔄 Flip</button>
  <button id="photoBtn">📸 Photo</button>
  <button id="startBtn">▶️ Start</button>
  <button id="stopBtn" disabled>⏹ Stop</button>
</div>

<div id="toast"></div>

<!-- CANVAS for photo + video -->
<canvas id="canvas" style="display:none;"></canvas>

<script>
let mediaRecorder;
let recordedChunks = [];
let cameraStream;
let canvasStream;
let drawInterval;
let currentFacing = "environment";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const videoEl = document.getElementById("preview");

const params = new URLSearchParams(window.location.search);
const userEmail = params.get("email");
const userName  = params.get("name");

function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.className = "show";
  setTimeout(() => toast.className = "", 3000);
}

/* START CAMERA */
async function startCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
  }

  cameraStream = await navigator.mediaDevices.getUserMedia({
    audio: true,
    video: {
      facingMode: { ideal: currentFacing }
    }
  });

  videoEl.srcObject = cameraStream;
}

startCamera();

/* FLIP CAMERA */
document.getElementById("flipBtn").onclick = async () => {
  currentFacing = currentFacing === "user" ? "environment" : "user";
  await startCamera();
};

/* DRAW VIDEO TO CANVAS (orientation-safe) */
function startCanvasDraw() {
  const isLandscape = window.innerWidth > window.innerHeight;

  const vw = videoEl.videoWidth;
  const vh = videoEl.videoHeight;

  if (isLandscape) {
    canvas.width = 1280;
    canvas.height = 720;
  } else {
    canvas.width = 720;
    canvas.height = 1280;
  }

  drawInterval = setInterval(() => {
    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (isLandscape) {
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(90 * Math.PI / 180);
      if (currentFacing === "user") ctx.scale(-1, 1);
      ctx.drawImage(videoEl, -vw / 2, -vh / 2);
    } else {
      if (currentFacing === "user") {
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
    }

    ctx.restore();
  }, 33); // ~30fps
}

/* PHOTO */
document.getElementById("photoBtn").onclick = () => {
  startCanvasDraw();
  setTimeout(() => {
    clearInterval(drawInterval);

    canvas.toBlob(blob => {
      const reader = new FileReader();
      reader.onloadend = () => {
        uploadToFlow({
          filename: "photo_" + Date.now() + ".jpg",
          filedata: reader.result.split(",")[1],
          filetype: "image"
        });
      };
      reader.readAsDataURL(blob);
    }, "image/jpeg", 0.95);
  }, 200);
};

/* VIDEO START */
document.getElementById("startBtn").onclick = () => {
  recordedChunks = [];
  startCanvasDraw();

  canvasStream = canvas.captureStream(30);
  mediaRecorder = new MediaRecorder(canvasStream);

  mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.start();
  startBtn.disabled = true;
  stopBtn.disabled = false;
};

/* VIDEO STOP */
document.getElementById("stopBtn").onclick = () => {
  mediaRecorder.stop();
  clearInterval(drawInterval);

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: "video/mp4" });
    const reader = new FileReader();

    reader.onloadend = () => {
      uploadToFlow({
        filename: "video_" + Date.now() + ".mp4",
        filedata: reader.result.split(",")[1],
        filetype: "video"
      });
    };

    reader.readAsDataURL(blob);
  };

  startBtn.disabled = false;
  stopBtn.disabled = true;
};

/* UPLOAD */
function uploadToFlow(payload) {
  fetch("https://3299cb60efafe263a7276ab328834e.db.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/334d4c7c43fc45cfb26d29910cf613d2/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=85YJTElGV4e568r9HA58gkQExjZequ_P3KOXOVuo5Wo", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      ...payload,
      userEmail,
      userName
    })
  })
  .then(() => showToast(payload.filetype + " uploaded successfully!"))
  .catch(() => showToast("Upload failed"));
}
</script>

</body>
</html>
